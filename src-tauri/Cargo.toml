[package]
name = "furry-agent-pet"
version = "0.1.0"
description = "A lightweight cross-platform desktop pet that visualizes MCP agent state."
authors = ["MasaoMinn"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "furry_agent_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gif = "0.14"
image-webp = "0.2.4"
png = "0.18.1"
sha2 = "0.10"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["io-util", "net", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[dev-dependencies]
tempfile = "3"
